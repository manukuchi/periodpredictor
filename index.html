<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Period Predictor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>The Period Predictor</h1>

    <div class="period-table">

        <label>
            How many days does your period last?
            <span class="info">
                ⓘ
                <span class="info-text">
                    Enter the usual number of days you bleed during your period.
                </span>
            </span>
        </label>
        <input type="number" id="periodLength" min="1" max="14" step="1" placeholder="Example: 5">

        <label>What is the date today?</label>
        <input type="date" id="todayDate">

        <label>When did your last period start?</label>
        <input type="date" id="lastPeriod">

        <label>
            How long is your menstrual cycle typically?
            <span class="info">
                ⓘ
                <span class="info-text">
                    Your menstrual cycle is the number of days from the first day of one period to the first day of your next period.
                </span>
            </span>
        </label>
        <input type="number" id="cycleLength" min="1" max="100" step="1" placeholder="Example: 28">

        <button onclick="predictPeriod()">Predict My Period</button>

    </div>

    <div id="result" class="result">
        <h2>Your Prediction</h2>
        <p id="nextPeriod"></p>
        <p id="periodEnds"></p>
        <p id="daysLeft"></p>
    </div>

    <script src="app.js"></script>

</body>
</html>
